name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: astro ${{ matrix.astro }} / node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            astro: 5
          - os: ubuntu-latest
            node: 22
            astro: 6
          - os: ubuntu-latest
            node: 22
            astro: 7
          - os: windows-latest
            node: 24
            astro: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 10.34 требует Node >=22.13, поэтому Node ставим первым.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Версия pnpm берётся из package.json → packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Astro ${{ matrix.astro }}
        run: pnpm add -D astro@${{ matrix.astro }}

      - name: Run tests
        run: pnpm test
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          CI: 'true'
